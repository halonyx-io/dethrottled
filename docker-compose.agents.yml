# Optional public REST/MCP adapters; keyless content workers are in the base file.
# docker compose -f docker-compose.yml -f docker-compose.agents.yml --profile public up -d --build
services:
  dethrottled:
    group_add: ["${DETHROTTLED_REGISTRY_GID:-10001}"]
    environment:
      DETHROTTLED_CALLER_REGISTRY: /run/secrets/tokens.json
      DETHROTTLED_ADAPTER_CIDRS: "${DETHROTTLED_ADAPTER_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}"
    volumes:
      - type: bind
        source: ${DETHROTTLED_TOKEN_REGISTRY_FILE:-./secrets/tokens.json}
        target: /run/secrets/tokens.json
        read_only: true
        bind:
          create_host_path: false
  mcp:
    profiles: [public]
    group_add: ["${DETHROTTLED_REGISTRY_GID:-10001}"]
    build:
      context: .
      dockerfile: adapters/Dockerfile
    image: dethrottled-adapters:${DETHROTTLED_VERSION:-1.8.7}
    restart: unless-stopped
    ports: ["127.0.0.1:${DETHROTTLED_MCP_PORT:-18184}:18184"]
    environment:
      MCP_BACKEND_URL: http://dethrottled:8787
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*}"
    volumes:
      - adapter-state:/state
      - type: bind
        source: ${DETHROTTLED_TOKEN_REGISTRY_FILE:-./secrets/tokens.json}
        target: /run/secrets/tokens.json
        read_only: true
        bind:
          create_host_path: false
    depends_on: [dethrottled]
  rest:
    profiles: [public]
    group_add: ["${DETHROTTLED_REGISTRY_GID:-10001}"]
    image: dethrottled-adapters:${DETHROTTLED_VERSION:-1.8.7}
    restart: unless-stopped
    command: [uvicorn, public_gateway:app, --host, 0.0.0.0, --port, "18186"]
    ports: ["127.0.0.1:${DETHROTTLED_REST_PORT:-18186}:18186"]
    environment:
      MCP_BACKEND_URL: http://dethrottled:8787
    volumes:
      - adapter-state:/state
      - type: bind
        source: ${DETHROTTLED_TOKEN_REGISTRY_FILE:-./secrets/tokens.json}
        target: /run/secrets/tokens.json
        read_only: true
        bind:
          create_host_path: false
    depends_on: [mcp]
volumes:
  adapter-state:
