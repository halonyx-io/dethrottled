# Explicitly isolated experiment. Does not inherit production Compose services.
name: dethrottled-dnb-lab
services:
  fixture:
    image: python:3.12-slim@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30
    command: [python, /fixture.py]
    volumes: ["./fixture.py:/fixture.py:ro"]
  reference-browser:
    image: dethrottled-dnb-browser:reference
    init: true
    shm_size: 1gb
    environment:
      DETHROTTLED_ADBLOCK: "0"
      DETHROTTLED_BROWSER_GRAPHICS: default
    ports: ["127.0.0.1:19981:19888"]
  reference-render:
    image: unclecode/crawl4ai:0.9.5@sha256:0b05666882bfb67f45d559a5b827839c54127b74aedd723f8ab338a3571b5fc9
    init: true
    shm_size: 1gb
    environment:
      CRAWL4AI_API_TOKEN: dnb-disposable-lab-only
      CRAWL4AI_ALLOW_INTERNAL_URLS: "true"
      CRAWL4AI_NO_CLOUD_NOTICE: "1"
      DETHROTTLED_ADBLOCK: "0"
    volumes: ["../../docker/crawl4ai/config.yml:/app/config.yml:ro"]
    ports: ["127.0.0.1:19982:11235"]
  candidate:
    restart: unless-stopped
    mem_limit: 4g
    cpus: 4
    pids_limit: 1024
    image: dethrottled-dnb:prototype
    init: true
    shm_size: 1gb
    environment:
      DETHROTTLED_ADBLOCK: "0"
      DETHROTTLED_BROWSER_GRAPHICS: default
      DNB_ALLOW_INTERNAL_URLS: "true"
      DNB_POOL_TOKEN: dnb-disposable-lab-only
    ports: ["127.0.0.1:19983:19888"]
