# The default web and format stack, self-hosted. Nothing in here calls an API you need a key
# for, and with the default settings nothing leaves your network except the
# fetches you asked for and the daily HaGeZi Multi PRO list update.
#
#     docker compose up -d
#     curl localhost:8787/health
#
# Search, fetch and document workers:
#
#   dethrottled  the search/fetch/extract API
#   searxng      real search engines, queried from your machine, not a hosted
#                aggregator with a quota
#   dnb          private Chromium worker for discovery, rendering and interaction
#   format-worker   private MSG/XLSB parsing, discovered automatically
#
# Add --profile media, --profile layout, or --profile full for local inference.
#
# The two upstream images are pinned by tag AND digest rather than :latest, so
# this file describes one stack rather than whatever upstream shipped today.
# See the comments at each image for how to move them forward.

name: dethrottled

services:
  dethrottled:
    build: .
    image: dethrottled-api:${DETHROTTLED_VERSION:-1.8.10}
    ulimits:
      core: 0
    restart: unless-stopped
    # Loopback ONLY. This service fetches arbitrary URLs on behalf of whoever
    # can reach it, which makes it a server-side request forgery engine for
    # anyone who can talk to it. Exposing it beyond localhost is a deliberate
    # decision -- read docs/OPERATIONS.md, then put an authenticating proxy in front.
    ports:
      # Loopback by default: this service fetches URLs on behalf of
      # whoever can reach it, and it has no authentication of its own.
      # Set DETHROTTLED_BIND=0.0.0.0 to publish it on a LAN you trust --
      # the port was already configurable and the address was not, which
      # meant editing this file, which meant diverging from the repo.
      - "${DETHROTTLED_BIND:-127.0.0.1}:${DETHROTTLED_PORT:-8787}:8787"
    environment:
      DETHROTTLED_ADBLOCK: "${DETHROTTLED_ADBLOCK:-1}"
      DETHROTTLED_ADBLOCK_DIR: /filters
      DETHROTTLED_SEARXNG_URL: http://searxng:8080
      DETHROTTLED_BROWSER_SEARCH_URL: http://dnb:19888
      DETHROTTLED_DNB: "1"
      DETHROTTLED_DNB_PUBLIC_KEY: /trust/issuer.pub
      MALLOC_ARENA_MAX: "2"
      DETHROTTLED_RERANK: "${DETHROTTLED_RERANK:-1}"
      DETHROTTLED_RERANK_DEPTH: "${DETHROTTLED_RERANK_DEPTH:-3}"
      DETHROTTLED_RERANK_KEEP_FIRST: "${DETHROTTLED_RERANK_KEEP_FIRST:-1}"
      DETHROTTLED_RERANK_MAX_TOKENS: "${DETHROTTLED_RERANK_MAX_TOKENS:-512}"
      DETHROTTLED_RERANK_TEXT_CHARS: "${DETHROTTLED_RERANK_TEXT_CHARS:-3000}"
      DETHROTTLED_RERANK_THREADS: "${DETHROTTLED_RERANK_THREADS:-8}"
      DETHROTTLED_RERANK_MODEL: /models/rerank-ettin-68m
      DETHROTTLED_CONNECT_TIMEOUT: "${DETHROTTLED_CONNECT_TIMEOUT:-2}"
      DETHROTTLED_READ_PLAN_SECONDS: "${DETHROTTLED_READ_PLAN_SECONDS:-30}"
      DETHROTTLED_CHEAP_DISCOVERY: "${DETHROTTLED_CHEAP_DISCOVERY:-1}"
      DETHROTTLED_DRIVE_SESSION_TTL: "${DETHROTTLED_DRIVE_SESSION_TTL:-1800}"
      DETHROTTLED_DRIVE_MAX_SESSIONS: "${DETHROTTLED_DRIVE_MAX_SESSIONS:-8}"
      # News engines asked through SearXNG. 14 Nov 2026 on SearXNG 2026.11.6:
      # DuckDuckGo News and Qwant News return dated, current results. Google
      # News and Reuters come from the API's own Google News RSS engine
      # (DETHROTTLED_NEWS_FEEDS); Bing News from its own RSS, which keeps dates
      # (SearXNG's Bing News returned none dated); Brave News stays off (undated).
      DETHROTTLED_SEARXNG_ENGINES: "${DETHROTTLED_SEARXNG_ENGINES:-duckduckgo news,qwant news}"
      DETHROTTLED_CRAWL4AI_URL: http://dnb:19888
      DETHROTTLED_CRAWL4AI_API: crawl
      DETHROTTLED_AUTO_WORKERS: "${DETHROTTLED_AUTO_WORKERS:-1}"
      DETHROTTLED_DATA_DIR: /data
      DETHROTTLED_LAYOUT_WORKER_URL: "${DETHROTTLED_LAYOUT_WORKER_URL:-}"
      DETHROTTLED_EXA_API_KEY: "${DETHROTTLED_EXA_API_KEY:-}"
      DETHROTTLED_TAVILY_API_KEY: "${DETHROTTLED_TAVILY_API_KEY:-}"
      DETHROTTLED_PARALLEL_API_KEY: "${DETHROTTLED_PARALLEL_API_KEY:-}"
      DETHROTTLED_FORMAT_WORKER_URL: "${DETHROTTLED_FORMAT_WORKER_URL:-}"
      DETHROTTLED_CORPUS_SCHEMA: "${DETHROTTLED_CORPUS_SCHEMA:-2}"
      DETHROTTLED_CORPUS_AUTOINDEX: "${DETHROTTLED_CORPUS_AUTOINDEX:-1}"
      DETHROTTLED_CORPUS_RETENTION_DAYS: "${DETHROTTLED_CORPUS_RETENTION_DAYS:-90}"
      DETHROTTLED_CORPUS_MAX_PASSAGES: "${DETHROTTLED_CORPUS_MAX_PASSAGES:-50000}"
      DETHROTTLED_CORPUS_DB_MIB: "${DETHROTTLED_CORPUS_DB_MIB:-512}"
      DETHROTTLED_CORPUS_VECTOR_MIB: "${DETHROTTLED_CORPUS_VECTOR_MIB:-256}"
      DETHROTTLED_CORPUS_HARVEST_CHARS: "${DETHROTTLED_CORPUS_HARVEST_CHARS:-8000000}"
      DETHROTTLED_CORPUS_LEXICAL_CHARS: "${DETHROTTLED_CORPUS_LEXICAL_CHARS:-2000000}"
      DETHROTTLED_CORPUS_PAGE_PASSAGES: "${DETHROTTLED_CORPUS_PAGE_PASSAGES:-32}"
      DETHROTTLED_CORPUS_LONG_PASSAGES: "${DETHROTTLED_CORPUS_LONG_PASSAGES:-96}"
      DETHROTTLED_CORPUS_QUEUE: "${DETHROTTLED_CORPUS_QUEUE:-256}"
      DETHROTTLED_MULTILINGUAL_CORPUS: "${DETHROTTLED_MULTILINGUAL_CORPUS:-1}"
      DETHROTTLED_CRAWL4AI_BUDGET: "${DETHROTTLED_CRAWL4AI_BUDGET:--1}"
      DETHROTTLED_RENDER_CONCURRENCY: "${DETHROTTLED_RENDER_CONCURRENCY:-2}"
      DETHROTTLED_MEDIA_WORKER_URL: "${DETHROTTLED_MEDIA_WORKER_URL:-}"
      DETHROTTLED_USER_AGENT: "${DETHROTTLED_USER_AGENT:-}"
      DETHROTTLED_EXTRACT_CACHE_CHARS: "${DETHROTTLED_EXTRACT_CACHE_CHARS:-4000000}"
      # MODEL_DIR is deliberately NOT set here. The image bakes the weights
      # into /opt/dethrottled/models, and pointing this at /data/models would
      # aim it at the volume instead -- where there are no models, so the
      # corpus would report itself unavailable on a stack that has everything
      # it needs.
    volumes:
      - adblock-state:/filters
      - dethrottled-data:/data
      - dnb-trust:/trust
      - rerank-models:/models/rerank-ettin-68m
    command:
      - /bin/sh
      - -ec
      - |
        if python -c 'from dethrottled.rerank import enabled; raise SystemExit(not enabled())'; then
          sh /app/scripts/fetch-rerank-model.sh || echo "Reranker seed failed; provider order remains available" >&2
        fi
        exec dethrottled --host 0.0.0.0 --port 8787
    depends_on:
      searxng:
        condition: service_started


  dnb:
    build:
      context: .
      dockerfile: browser-search/Dockerfile
      target: dnb
    image: dethrottled-dnb:${DETHROTTLED_VERSION:-1.8.10}
    group_add: ["10001"]
    init: true
    restart: unless-stopped
    shm_size: 1gb
    mem_limit: 4g
    cpus: 4
    pids_limit: 1024
    environment:
      DETHROTTLED_BROWSER_STATE_DIR: /state
      DETHROTTLED_DNB_STATE_DIR: /state
      DETHROTTLED_ADBLOCK: "${DETHROTTLED_ADBLOCK:-1}"
      DETHROTTLED_ADBLOCK_DIR: /filters
      DETHROTTLED_ADBLOCK_COMPONENT: browser
      DETHROTTLED_ADBLOCK_READER: "1"
      DETHROTTLED_BROWSER_GRAPHICS: "${DETHROTTLED_BROWSER_GRAPHICS:-auto}"
      DETHROTTLED_RENDER_CONCURRENCY: "${DETHROTTLED_RENDER_CONCURRENCY:-2}"
      DETHROTTLED_BROWSER_RECOVERY: "${DETHROTTLED_BROWSER_RECOVERY:-auto}"
      DNB_ALLOW_INTERNAL_URLS: "${DNB_ALLOW_INTERNAL_URLS:-true}"
      DNB_TRUST_PUBLIC_KEY: /trust/issuer.pub
    volumes:
      - dnb-state:/state
      - adblock-state:/filters:ro
      - dnb-trust:/trust:ro
    depends_on:
      dethrottled:
        condition: service_healthy
    expose: ["19888"]

  browser-search:
    profiles: [legacy-browser-search]
    group_add: ["10001"]
    init: true
    build:
      context: .
      dockerfile: browser-search/Dockerfile
    image: dethrottled-browser-search:${DETHROTTLED_VERSION:-1.8.10}
    restart: unless-stopped
    environment:
      DETHROTTLED_BROWSER_STATE_DIR: /state
      DETHROTTLED_ADBLOCK: "${DETHROTTLED_ADBLOCK:-1}"
      DETHROTTLED_ADBLOCK_DIR: /filters
      DETHROTTLED_ADBLOCK_READER: "1"
      DETHROTTLED_ADBLOCK_COMPONENT: browser
      DETHROTTLED_BROWSER_GRAPHICS: "${DETHROTTLED_BROWSER_GRAPHICS:-auto}"
      DETHROTTLED_BROWSER_RECOVERY: "${DETHROTTLED_BROWSER_RECOVERY:-auto}"
      DETHROTTLED_DRIVE_SESSION_TTL: "${DETHROTTLED_DRIVE_SESSION_TTL:-1800}"
      DETHROTTLED_DRIVE_MAX_SESSIONS: "${DETHROTTLED_DRIVE_MAX_SESSIONS:-8}"
    expose:
      - "19888"
    volumes:
      - browser-state:/state
      - adblock-state:/filters
    shm_size: 1gb

  searxng:
    group_add: ["10001"]
    # Pinned. 2026.11.6: Qwant News works on it (access denied on 2026.10.2) and
    # Brave News no longer crashes; see evaluations/news-profile.
    image: searxng/searxng:2026.11.6-a3013ef11@sha256:db2fb02636f8e3d15f9b59a3f9ed924afdfbcecb3768bdcf461cb878c50f9e57
    restart: unless-stopped
    volumes:
      - adblock-state:/filters
      - ./src/dethrottled/adblock.py:/usr/local/searxng/searx/plugins/dethrottled_adblock.py:ro
      - ./docker/searxng:/etc/searxng:ro
      - ./docker/searxng/dethrottled_guard.py:/usr/local/searxng/searx/plugins/dethrottled_guard.py:ro
      - ./docker/searxng/retry_after.py:/usr/local/searxng/searx/plugins/dethrottled_retry_after.py:ro
    environment:
      # Only ever reached from the dethrottled container on the compose
      # network, so this is not a public base URL.
      SEARXNG_BASE_URL: http://searxng:8080/
      DETHROTTLED_ADBLOCK: "${DETHROTTLED_ADBLOCK:-1}"
      DETHROTTLED_ADBLOCK_DIR: /filters
      DETHROTTLED_ADBLOCK_READER: "1"
      DETHROTTLED_ADBLOCK_COMPONENT: searxng
    # Deliberately NOT published to the host. Nothing outside this compose
    # network needs to reach it, and an open SearXNG is an open proxy.
    expose:
      - "8080"

  crawl4ai:
    profiles: [legacy-crawl4ai]
    group_add: ["10001"]
    # Pinned 0.9.5: safer untrusted requests and correct quoted CSS extraction.
    # Verified against JS, quoted selector/wait, missing-page and rejection probes.
    image: unclecode/crawl4ai:0.9.5@sha256:0b05666882bfb67f45d559a5b827839c54127b74aedd723f8ab338a3571b5fc9
    restart: unless-stopped
    environment:
      # Upstream binds to loopback ONLY unless a credential is present -- its
      # entrypoint chooses gunicorn's bind address from whether this is set.
      # That is a sound default: a renderer reachable on a network with no auth
      # is an open proxy that also runs a browser.
      #
      # This token guards container-to-container traffic on a private bridge
      # network. The service is `expose`d and never published to the host, so
      # nothing outside this compose project can reach it either way -- but set
      # CRAWL4AI_TOKEN in .env anyway if you would rather not run a default.
      PYTHONPATH: /opt/dethrottled-network
      DETHROTTLED_ADBLOCK: "${DETHROTTLED_ADBLOCK:-1}"
      DETHROTTLED_ADBLOCK_DIR: /filters
      DETHROTTLED_ADBLOCK_READER: "1"
      DETHROTTLED_ADBLOCK_COMPONENT: crawl4ai
      CRAWL4AI_NO_CLOUD_NOTICE: "1"
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_TOKEN:-dethrottled-compose-local}"
      # Set true in .env when callers intentionally fetch trusted LAN sites.
      CRAWL4AI_ALLOW_INTERNAL_URLS: "${CRAWL4AI_ALLOW_INTERNAL_URLS:-false}"
    volumes:
      # Tuned copy of the image default: a smaller browser pool, a shorter idle
      # cutoff, and a lower memory ceiling. See the header of that file for why
      # each one moved. Without it the pool will open up to forty concurrent
      # tabs and not start shedding them until the host is at 95% memory.
      - adblock-state:/filters
      - ./docker/crawl4ai/sitecustomize.py:/opt/dethrottled-network/sitecustomize.py:ro
      - ./src/dethrottled/adblock.py:/opt/dethrottled-network/dethrottled_adblock.py:ro
      - ./src/dethrottled/adblock_browser.py:/opt/dethrottled-network/dethrottled_adblock_browser.py:ro
      - ./src/dethrottled/adblock_proxy.py:/opt/dethrottled-network/dethrottled_adblock_proxy.py:ro
      - ./docker/crawl4ai/config.yml:/app/config.yml:ro
    expose:
      - "11235"
    # Chromium needs more shared memory than Docker's 64MB default. Renders
    # fail in ways that look like timeouts rather than like out-of-memory,
    # which is a slow afternoon if you have not seen it before.
    shm_size: 1gb

  docling-worker:
    profiles: [layout, full]
    build:
      context: .
      dockerfile: docling-worker/Dockerfile
    image: dethrottled-docling:${DETHROTTLED_VERSION:-1.8.10}
    ulimits:
      core: 0
    init: true
    restart: unless-stopped
    environment:
      OMP_NUM_THREADS: "${DETHROTTLED_WORKER_THREADS:-4}"
    volumes: [layout-models:/models]
    expose: ["19891"]
    mem_limit: 8g
    cpus: 4
    pids_limit: 256
  format-worker:
    build:
      context: .
      dockerfile: format-worker/Dockerfile
    image: dethrottled-formats:${DETHROTTLED_VERSION:-1.8.10}
    ulimits:
      core: 0
    init: true
    restart: unless-stopped
    expose: ["19892"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
  media-worker:
    profiles: [media, full]
    build:
      context: .
      dockerfile: media-worker/Dockerfile
    image: dethrottled-media:${DETHROTTLED_VERSION:-1.8.10}
    ulimits:
      core: 0
    init: true
    restart: unless-stopped
    environment:
      OMP_NUM_THREADS: "${DETHROTTLED_WORKER_THREADS:-4}"
      WHISPER_MODEL: "${WHISPER_MODEL:-small}"
      MEDIA_MAX_SECONDS: "${MEDIA_MAX_SECONDS:-1800}"
    volumes: [media-models:/models]
    expose: ["19889"]
    mem_limit: 3g
volumes:
  dnb-state:
  dnb-trust:
  rerank-models:
  adblock-state:
  browser-state:
  dethrottled-data:
  media-models:
  layout-models:
