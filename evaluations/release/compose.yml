# Apply after the base file. No .env, host paths, GPU or production volumes.
services:
  dethrottled:
    image: dethrottled:one-zero-candidate
  dnb:
    image: dethrottled-dnb:one-zero-candidate
  format-worker:
    image: dethrottled-formats:one-zero-candidate
  fixture:
    image: python:3.12-slim
    volumes:
      - ./evaluations:/evaluations:ro
    command: [python, /evaluations/release/fixture.py]
