# SearXNG configuration for dethrottled.
#
# Two things here are not the SearXNG defaults, and both matter:
#
#   1. `formats` includes json. SearXNG serves HTML only out of the box, so
#      without this every API query returns a 403 and the search tier looks
#      broken rather than misconfigured.
#   2. the limiter is off. It exists to stop strangers hammering a public
#      instance; this one is not published to the host and is reachable only
#      from the dethrottled container, so the only thing it can rate-limit is
#      you.

use_default_settings: true

# The pinned upstream version otherwise ignores Retry-After on HTTP refusals.
# This adapter extends its suspension; it never shortens the CAPTCHA policy.
plugins:
  searx.plugins.dethrottled_guard.SXNGPlugin:
    active: true

general:
  instance_name: "dethrottled"
  # Nothing here should be advertising itself.
  enable_metrics: false

server:
  # Overridden by SEARXNG_SECRET in compose if you set one. Change it if you
  # ever expose this beyond the compose network.
  secret_key: "dethrottled-local-only-change-me-if-exposed"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  # json is the one that matters. csv and rss cost nothing to leave on.
  formats:
    - html
    - json

# General web discovery uses the separate headed DDG worker. These scraped
# Bing/Brave/Google failed or returned unrelated rows in local evaluations.
# November 3 paced tests support Yahoo/Yandex as bounded supplements.
# Retain the working news engines and explicitly enable specialist complements.
# Select sources per request; do not indiscriminately merge academic/local news.
engines:
  - name: yahoo
    disabled: false
  - name: yandex
    disabled: false
  - name: google
    disabled: true
  - name: brave
    disabled: true
  - name: bing
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: mwmbl
    disabled: false
  - name: crossref
    disabled: false
  - name: openalex
    disabled: false
  - name: arxiv
    disabled: false
  # News. 14 Nov 2026, five current-events queries on 2026.11.6: DuckDuckGo
  # News 107 results, all dated, 80 within 48 h; Qwant News 47, all dated, 31
  # within 48 h, an independent second source. Brave News returned 228 rows
  # but 2 dated, Bing News via SearXNG none (its direct RSS keeps dates), and
  # Google News is refused, so those stay as they were.
  - name: qwant news
    disabled: false
