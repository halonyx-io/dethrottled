# Optional overlay: an HTML-to-PDF worker. See docs/PDF_WORKER.md.
# Enable with COMPOSE_FILE=docker-compose.yml:docker-compose.pdf-worker.yml in .env.
# Runs on the dethrottled browser image (1.9.0): Patchright with Google Chrome on
# amd64, Chromium on arm64. Until 1.9.0 it borrowed an upstream Crawl4AI image.

services:
  pdf-worker:
    image: dethrottled-dnb:${DETHROTTLED_VERSION:-1.9.3}
    user: "10002:10002"
    restart: unless-stopped
    # PID 1 here is Python, which does not reap children. Without an init process every browser helper that
    # exits stays behind as a zombie, one set per PDF. `init: true` runs tini, which reaps them.
    init: true
    # The image's built-in health check looks at the browser worker's port, which this service does not run.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    entrypoint: ["python", "/worker/worker.py"]
    command: []
    environment:
      PDF_WORKER_PORT: "8788"
      HOME: /tmp
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    # Published on all interfaces: the worker cannot fetch anything, so a trusted LAN may use it freely.
    # Bind it to 127.0.0.1 here if yours is not.
    ports:
      - "0.0.0.0:8788:8788"
    volumes:
      - ./docker/pdf-worker:/worker:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    shm_size: 1gb
