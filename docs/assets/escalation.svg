<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="685"
viewBox="0 0 1200 685"
role="img" aria-labelledby="title"><title id="title">Acquire, assess and recover in a bounded loop; return evidence for agent continuation</title>
<defs>

<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
orient="auto"><path d="M0,0 L8,4 L0,8" fill="#22D3EE"/></marker>

<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#2A3540" stroke-opacity=".22"/></pattern>

</defs>
<rect width="1200" height="685" rx="16" fill="#0F1720"/>

<g font-family="Inter,DejaVu Sans,Arial,sans-serif"><text x="45" y="55" fill="#F8FAFC" font-size="27" font-weight="600">AUTONOMOUS READING, WITH A VISIBLE STOPPING POINT</text><text x="45" y="90" fill="#93A3B2" font-size="19" font-weight="400">Recover from observed gaps. Reassess each attempt. Return evidence and useful next steps.</text><rect x="45" y="150" width="270" height="130" rx="12" fill="#16212C" stroke="#2A3540"/><text x="67" y="186" fill="#F8FAFC" font-size="22" font-weight="600">ACQUIRE</text><text x="67" y="218" fill="#93A3B2" font-size="17" font-weight="400">Direct HTTP / TLS</text><text x="67" y="244" fill="#93A3B2" font-size="17" font-weight="400">Read source + metadata</text><rect x="395" y="150" width="365" height="130" rx="12" fill="#16212C" stroke="#22D3EE"/><text x="417" y="186" fill="#22D3EE" font-size="22" font-weight="600">ASSESS</text><text x="417" y="218" fill="#93A3B2" font-size="17" font-weight="400">Useful text? Missing material?</text><text x="417" y="244" fill="#93A3B2" font-size="17" font-weight="400">Challenge, shell or error banner?</text><rect x="845" y="150" width="310" height="130" rx="12" fill="#16212C" stroke="#2A3540"/><text x="867" y="186" fill="#F8FAFC" font-size="22" font-weight="600">RETURN EVIDENCE</text><text x="867" y="218" fill="#93A3B2" font-size="17" font-weight="400">Quality + warnings + origin</text><text x="867" y="244" fill="#93A3B2" font-size="17" font-weight="400">Document ID + next actions</text><path d="M315,215 L385,215" fill="none" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/><path d="M760,215 L835,215" fill="none" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/><rect x="395" y="385" width="365" height="200" rx="12" fill="#16212C" stroke="#2A3540"/><text x="417" y="421" fill="#F8FAFC" font-size="22" font-weight="600">BOUNDED RECOVERY</text><text x="417" y="453" fill="#93A3B2" font-size="17" font-weight="400">Observed publisher alternatives</text><text x="417" y="479" fill="#93A3B2" font-size="17" font-weight="400">JavaScript rendering</text><text x="417" y="505" fill="#93A3B2" font-size="17" font-weight="400">Headed browser + scoped actions</text><text x="417" y="531" fill="#93A3B2" font-size="17" font-weight="400">Preserve source provenance</text><path d="M485,280 L485,375" fill="none" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/><text x="410" y="337" fill="#93A3B2" font-size="17" font-weight="400">Recover</text><path d="M680,385 L680,290" fill="none" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/><text x="690" y="337" fill="#93A3B2" font-size="17" font-weight="400">Reassess</text><rect x="845" y="385" width="310" height="200" rx="12" fill="#16212C" stroke="#2A3540"/><text x="867" y="421" fill="#F8FAFC" font-size="22" font-weight="600">AGENT CONTINUATION</text><text x="867" y="453" fill="#93A3B2" font-size="17" font-weight="400">Reuse /drive session</text><text x="867" y="479" fill="#93A3B2" font-size="17" font-weight="400">Read retained ranges</text><text x="867" y="505" fill="#93A3B2" font-size="17" font-weight="400">Inspect pixels / downloads</text><text x="867" y="531" fill="#93A3B2" font-size="17" font-weight="400">Choose the next action</text><path d="M1000,280 L1000,375" fill="none" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/><text x="1015" y="337" fill="#93A3B2" font-size="17" font-weight="400">If needed</text><text x="45" y="640" fill="#93A3B2" font-size="20" font-weight="400">Retries and deadlines are bounded. Partial, polluted and blocked outcomes stay explicit.</text></g></svg>
