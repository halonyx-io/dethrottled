<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590"
viewBox="0 0 1200 590"
role="img" aria-labelledby="title"><title id="title">Acquire, assess, recover and return inspectable evidence</title>
<defs>

<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
orient="auto"><path d="M0,0 L8,4 L0,8" fill="#43e0d0"/></marker>

<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#29404d" stroke-opacity=".22"/></pattern>

</defs>
<rect width="1200" height="590" rx="22" fill="#0b1118"/>
<rect width="1200" height="590" fill="url(#grid)"/>
<g font-family="Inter,DejaVu Sans,Arial,sans-serif"><text x="45" y="55" fill="#f0f7fa" font-size="27" font-weight="600">AUTONOMOUS READING, WITH A VISIBLE STOPPING POINT</text><text x="45" y="90" fill="#9eb2bf" font-size="19" font-weight="400">The reader chooses recovery from observed gaps; the agent can continue explicitly.</text><rect x="45" y="135" width="270" height="130" rx="16" fill="#14212c" stroke="#29404d"/><text x="67" y="171" fill="#f0f7fa" font-size="22" font-weight="600">ACQUIRE</text><text x="67" y="203" fill="#9eb2bf" font-size="17" font-weight="400">Direct HTTP / TLS</text><text x="67" y="229" fill="#9eb2bf" font-size="17" font-weight="400">Read source + metadata</text><rect x="395" y="135" width="365" height="130" rx="16" fill="#14212c" stroke="#43e0d0"/><text x="417" y="171" fill="#43e0d0" font-size="22" font-weight="600">ASSESS</text><text x="417" y="203" fill="#9eb2bf" font-size="17" font-weight="400">Useful text? Missing material?</text><text x="417" y="229" fill="#9eb2bf" font-size="17" font-weight="400">Challenge, shell or error banner?</text><rect x="845" y="135" width="310" height="130" rx="16" fill="#14212c" stroke="#29404d"/><text x="867" y="171" fill="#f0f7fa" font-size="22" font-weight="600">RETURN EVIDENCE</text><text x="867" y="203" fill="#9eb2bf" font-size="17" font-weight="400">Quality + warnings + origin</text><text x="867" y="229" fill="#9eb2bf" font-size="17" font-weight="400">Document ID + next actions</text><path d="M320,200 L385,200" fill="none" stroke="#43e0d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M765,200 L835,200" fill="none" stroke="#43e0d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M575,270 L575,320" fill="none" stroke="#43e0d0" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="335" width="350" height="145" rx="16" fill="#14212c" stroke="#29404d"/><text x="67" y="371" fill="#f0f7fa" font-size="22" font-weight="600">PUBLISHER REPRESENTATIONS</text><text x="67" y="403" fill="#9eb2bf" font-size="17" font-weight="400">Observed feed / print / structured data</text><text x="67" y="429" fill="#9eb2bf" font-size="17" font-weight="400">Keep original source provenance</text><rect x="425" y="335" width="350" height="145" rx="16" fill="#14212c" stroke="#29404d"/><text x="447" y="371" fill="#f0f7fa" font-size="22" font-weight="600">BROWSER RECOVERY</text><text x="447" y="403" fill="#9eb2bf" font-size="17" font-weight="400">Render JS, then headed interaction</text><text x="447" y="429" fill="#9eb2bf" font-size="17" font-weight="400">Scroll, details, observed responses</text><rect x="805" y="335" width="350" height="145" rx="16" fill="#14212c" stroke="#29404d"/><text x="827" y="371" fill="#f0f7fa" font-size="22" font-weight="600">AGENT CONTINUATION</text><text x="827" y="403" fill="#9eb2bf" font-size="17" font-weight="400">Reuse /drive session or read ranges</text><text x="827" y="429" fill="#9eb2bf" font-size="17" font-weight="400">Inspect pixels and collect downloads</text><path d="M575,320 L220,328" fill="none" stroke="#43e0d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M575,320 L600,328" fill="none" stroke="#43e0d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M575,320 L980,328" fill="none" stroke="#43e0d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 485 V510 H790 V200 H765" stroke="#43e0d0" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="45" y="542" fill="#9eb2bf" font-size="20" font-weight="400">Bounded retries and deadlines. Partial, polluted and blocked outcomes stay explicit.</text></g></svg>
