<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t"><title id="t">dethrottled: self-hosted web access for AI agents. Search it, read it, drive it, keep it, with no API keys.</title><defs><style>@font-face{font-family:"hx-inter";src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"hx-inter-semibold";src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"hx-grotesk";src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"hx-grotesk-bold";src:url(data:font/woff2;base64,) format("woff2")}</style><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1D2B38" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22D3EE"/></marker></defs><rect width="1280" height="440" rx="16" fill="#0F1720"/><rect width="1280" height="440" rx="16" fill="url(#grid)" opacity=".55"/><text x="64" y="92" font-family="hx-inter-semibold" font-size="14" fill="#22D3EE" text-anchor="start" letter-spacing="1.20">SELF-HOSTED WEB ACCESS FOR AI AGENTS</text><text x="60" y="178" font-family="hx-grotesk-bold" font-size="84" fill="#F8FAFC" text-anchor="start">dethrottled</text><text x="64" y="232" font-family="hx-grotesk" font-size="28" fill="#F8FAFC" text-anchor="start">Search it. Read it. Drive it. Keep it.</text><text x="64" y="274" font-family="hx-inter" font-size="18" fill="#93A3B2" text-anchor="start">On your own hardware, with results that say exactly</text><text x="64" y="300" font-family="hx-inter" font-size="18" fill="#93A3B2" text-anchor="start">what they got and what to try next.</text><rect x="64" y="340" width="138" height="34" rx="17" fill="#16212C" stroke="#2A3A48"/><circle cx="80" cy="357" r="3.5" fill="#22D3EE"/><text x="91" y="362" font-family="hx-inter-semibold" font-size="14" fill="#F8FAFC" text-anchor="start">No API keys</text><rect x="212" y="340" width="156" height="34" rx="17" fill="#16212C" stroke="#2A3A48"/><circle cx="228" cy="357" r="3.5" fill="#22D3EE"/><text x="239" y="362" font-family="hx-inter-semibold" font-size="14" fill="#F8FAFC" text-anchor="start">AMD64 + ARM64</text><rect x="378" y="340" width="129" height="34" rx="17" fill="#16212C" stroke="#2A3A48"/><circle cx="394" cy="357" r="3.5" fill="#22D3EE"/><text x="405" y="362" font-family="hx-inter-semibold" font-size="14" fill="#F8FAFC" text-anchor="start">MCP + REST</text><rect x="517" y="340" width="147" height="34" rx="17" fill="#16212C" stroke="#2A3A48"/><circle cx="533" cy="357" r="3.5" fill="#22D3EE"/><text x="544" y="362" font-family="hx-inter-semibold" font-size="14" fill="#F8FAFC" text-anchor="start">MIT licensed</text><rect x="724" y="56" width="492" height="336" rx="12" fill="#16212C" stroke="#2A3A48"/><path d="M736 57H1204" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/><text x="752" y="96" font-family="hx-inter-semibold" font-size="13" fill="#22D3EE" text-anchor="start" letter-spacing="0.90">POST /fetch</text><text x="856" y="96" font-family="hx-inter" font-size="14" fill="#93A3B2" text-anchor="start">sqlite.org/wal.html</text><path d="M752 114H1188" stroke="#2A3A48"/><text x="752" y="148" font-family="hx-inter" font-size="17" xml:space="preserve"><tspan fill="#F8FAFC">{</tspan></text><text x="772" y="176" font-family="hx-inter" font-size="17" xml:space="preserve"><tspan fill="#93A3B2">&quot;quality&quot;</tspan><tspan fill="#F8FAFC">: </tspan><tspan fill="#22D3EE">&quot;ok&quot;</tspan><tspan fill="#F8FAFC">,</tspan></text><text x="772" y="204" font-family="hx-inter" font-size="17" xml:space="preserve"><tspan fill="#93A3B2">&quot;content_status&quot;</tspan><tspan fill="#F8FAFC">: </tspan><tspan fill="#22D3EE">&quot;complete&quot;</tspan><tspan fill="#F8FAFC">,</tspan></text><text x="772" y="232" font-family="hx-inter" font-size="17" xml:space="preserve"><