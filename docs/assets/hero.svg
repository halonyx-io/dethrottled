<g font-family="Inter,DejaVu Sans,Arial,sans-serif"><text x="55" y="64" fill="#22D3EE" font-size="17" font-weight="600">LOCAL-FIRST WEB INFRASTRUCTURE</text><text x="50" y="155" fill="#F8FAFC" font-size="88" font-weight="700">dethrottled</text><text x="55" y="207" fill="#93A3B2" font-size="29" font-weight="400">Web evidence. One local engine.</text><text x="55" y="252" fill="#F8FAFC" font-size="21" font-weight="400">Discover sources. Read deeply. Drive the browser.</text><text x="55" y="291" fill="#93A3B2" font-size="18" font-weight="400">Keyless default stack · Python + Docker · REST + MCP</text><rect x="55" y="335" width="260" height="100" rx="12" fill="#16212C" stroke="#2A3540"/><text x="77" y="371" fill="#F8FAFC" font-size="22" font-weight="600">SEARCH</text><text x="77" y="403" fill="#93A3B2" font-size="17" font-weight="400">Compact source choices</text><path d="M318,385 L334,385" fill="none" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="335" width="260" height="100" rx="12" fill="#16212C" stroke="#2A3540"/><text x="362" y="371" fill="#F8FAFC" font-size="22" font-weight="600">READ</text><text x="362" y="403" fill="#93A3B2" font-size="17" font-weight="400">Pages, files and tables</text><path d="M603,385 L619,385" fill="none" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/><rect x="625" y="335" width="260" height="100" rx="12" fill="#16212C" stroke="#22D3EE"/><text x="647" y="371" fill="#22D3EE" font-size="22" font-weight="600">DRIVE</text><text x="647" y="403" fill="#93A3B2" font-size="17" font-weight="400">Native browser actions</text><path d="M888,385 L904,385" fill="none" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/><rect x="910" y="335" width="260" height="100" rx="12" fill="#16212C" stroke="#2A3540"/><text x="932" y="371" fill="#F8FAFC" font-size="22" font-weight="600">RETAIN</text><text x="932" y="403" fill="#93A3B2" font-size="17" font-weight="400">Evidence you can revisit</text></g></svg>
