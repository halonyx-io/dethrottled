<rect width="1200" height="665" rx="22" fill="#0b1118"/>
<rect width="1200" height="665" fill="url(#grid)"/>
<g font-family="Inter,DejaVu Sans,Arial,sans-serif"><text x="45" y="55" fill="#f0f7fa" font-size="28" font-weight="600">ONE INTERFACE, A COMPLETE LOCAL STACK</text><text x="45" y="88" fill="#9eb2bf" font-size="19" font-weight="400">REST and optional MCP adapters expose the same evidence workflow.</text><rect x="45" y="128" width="245" height="130" rx="16" fill="#14212c" stroke="#29404d"/><text x="67" y="164" fill="#f0f7fa" font-size="22" font-weight="600">YOUR CLIENT</text><text x="67" y="196" fill="#9eb2bf" font-size="17" font-weight="400">Agent or application</text><text x="67" y="222" fill="#9eb2bf" font-size="17" font-weight="400">No model API required</text><rect x="350" y="128" width="805" height="130" rx="16" fill="#14212c" stroke="#43e0d0"/><text x="372" y="164" fill="#43e0d0" font-size="22" font-weight="600">DETHROTTLED API</text><text x="372" y="196" fill="#9eb2bf" font-size="17" font-weight="400">Search · fetch · research · drive · retained documents</text><text x="372" y="222" fill="#9eb2bf" font-size="17" font-weight="400">Acquisition policy, content assessment, provenance and continuation</text><path d="M295,193 L345,193" fill="none" stroke="#43e0d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M175,270 L175,307" fill="none" stroke="#43e0d0" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="317" width="260" height="144" rx="16" fill="#14212c" stroke="#29404d"/><text x="67" y="353" fill="#f0f7fa" font-size="22" font-weight="600">Browser</text><text x="67" y="385" fill="#9eb2bf" font-size="17" font-weight="400">Headed Chromium</text><text x="67" y="411" fill="#9eb2bf" font-size="17" font-weight="400">DDG + interaction</text><path d="M460,270 L460,307" fill="none" stroke="#43e0d0" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="317" width="260" height="144" rx="16" fill="#14212c" stroke="#29404d"/><text x="352" y="353" fill="#f0f7fa" font-size="22" font-weight="600">SearXNG</text><text x="352" y="385" fill="#9eb2bf" font-size="17" font-weight="400">Supplementary search</text><text x="352" y="411" fill="#9eb2bf" font-size="17" font-weight="400">Private engine gateway</text><path d="M745,270 L745,307" fill="none" stroke="#43e0d0" stroke-width="2" marker-end="url(#arrow)"/><rect x="615" y="317" width="260" height="144" rx="16" fill="#14212c" stroke="#29404d"/><text x="637" y="353" fill="#f0f7fa" font-size="22" font-weight="600">Crawl4AI</text><text x="637" y="385" fill="#9eb2bf" font-size="17" font-weight="400">JavaScript rendering</text><text x="637" y="411" fill="#9eb2bf" font-size="17" font-weight="400">Private Chromium pool</text><path d="M1030,270 L1030,307" fill="none" stroke="#43e0d0" stroke-width="2" marker-end="url(#arrow)"/><rect x="900" y="317" width="260" height="144" rx="16" fill="#14212c" stroke="#29404d"/><text x="922" y="353" fill="#f0f7fa" font-size="22" font-weight="600">Format reader</text><text x="922" y="385" fill="#9eb2bf" font-size="17" font-weight="400">MSG and XLSB</text><text x="922" y="411" fill="#9eb2bf" font-size="17" font-weight="400">Private Apache Tika</text><rect x="45" y="510" width="545" height="119" rx="16" fill="#14212c" stroke="#29404d"/><text x="67" y="546" fill="#f0f7fa" font-size="22" font-weight="600">PERSISTENT EVIDENCE</text><text x="67" y="578" fill="#9eb2bf" font-size="17" font-weight="400">Documents, tables, cache, jobs and corpus</text><text x="67" y="604" fill="#9eb2bf" font-size="17" font-weight="400">Named data volume; survives stack down</text><rect x="615" y="510" width="540" height="119" rx="16" fill="#14212c" stroke="#29404d"/><text x="637" y="546" fill="#f0f7fa" font-size="22" font-weight="600">OPTIONAL INFERENCE</text><text x="637" y="578" fill="#9eb2bf" font-size="17" font-weight="400">Speech transcription · PDF layout + tables</text><text x="637" y="604" fill="#9eb2bf" font-size="17" font-weight="400">Local models; separate profiles and model volumes</text></g></svg>
