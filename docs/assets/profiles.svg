<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540"
viewBox="0 0 1200 540"
role="img" aria-labelledby="title"><title id="title">Default stack and optional worker profiles</title>
<defs>

<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
orient="auto"><path d="M0,0 L8,4 L0,8" fill="#22D3EE"/></marker>

