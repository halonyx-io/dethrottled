<path d="M40 0H0V40" fill="none" stroke="#2A3540" stroke-opacity=".22"/></pattern>

</defs>
<rect width="1200" height="540" rx="16" fill="#0F1720"/>

<g font-family="Inter,DejaVu Sans,Arial,sans-serif"><text x="45" y="55" fill="#F8FAFC" font-size="28" font-weight="600">CHOOSE CAPABILITY, KEEP THE SAME WORKFLOW</text><text x="45" y="90" fill="#93A3B2" font-size="18" font-weight="400">Installing the Python package starts nothing. Explicit stack up builds and starts services.</text><rect x="45" y="135" width="545" height="215" rx="12" fill="#16212C" stroke="#22D3EE"/><text x="67" y="171" fill="#22D3EE" font-size="22" font-weight="600">DEFAULT · FIVE SERVICES</text><text x="67" y="203" fill="#93A3B2" font-size="17" font-weight="400">API + document libraries + OCR + corpus models</text><text x="67" y="229" fill="#93A3B2" font-size="17" font-weight="400">Headed browser + SearXNG + Crawl4AI</text><text x="67" y="255" fill="#93A3B2" font-size="17" font-weight="400">Format reader for MSG / XLSB</text><text x="67" y="281" fill="#93A3B2" font-size="17" font-weight="400">No GPU, worker URL or API key required</text><rect x="620" y="135" width="535" height="100" rx="12" fill="#16212C" stroke="#2A3540"/><text x="642" y="171" fill="#F8FAFC" font-size="22" font-weight="600">MEDIA PROFILE</text><text x="642" y="203" fill="#93A3B2" font-size="17" font-weight="400">Adds CPU speech recognition; first-use model download</text><rect x="620" y="255" width="535" height="100" rx="12" fill="#16212C" stroke="#2A3540"/><text x="642" y="291" fill="#F8FAFC" font-size="22" font-weight="600">LAYOUT PROFILE</text><text x="642" y="323" fill="#93A3B2" font-size="17" font-weight="400">Adds PDF layout / tables; first-use model download</text><rect x="45" y="390" width="545" height="110" rx="12" fill="#16212C" stroke="#2A3540"/><text x="67" y="426" fill="#F8FAFC" font-size="22" font-weight="600">FULL PROFILE</text><text x="67" y="458" fill="#93A3B2" font-size="17" font-weight="400">Default + media + layout; costs measured separately</text><rect x="620" y="390" width="535" height="110" rx="12" fill="#16212C" stroke="#2A3540"/><text x="642" y="426" fill="#F8FAFC" font-size="22" font-weight="600">STANDALONE PYTHON</text><text x="642" y="458" fill="#93A3B2" font-size="17" font-weight="400">HTTP/library server; external worker capabilities vary</text></g></svg>
