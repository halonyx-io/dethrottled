viewBox="0 0 1200 410"
role="img" aria-labelledby="title"><title id="title">Tested hardware: eight-core ARM64 edge device and Ryzen 7 x86_64 mini PC</title>
<defs>

<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
orient="auto"><path d="M0,0 L8,4 L0,8" fill="#22D3EE"/></marker>

