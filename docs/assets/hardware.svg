<rect width="1200" height="410" rx="16" fill="#0F1720"/>

<g font-family="Inter,DejaVu Sans,Arial,sans-serif"><text x="45" y="55" fill="#F8FAFC" font-size="28" font-weight="600">TWO DEVICES. ONE ENGINE AND WORKLOAD.</text><text x="45" y="90" fill="#93A3B2" font-size="19" font-weight="400">Default-stack measurements use software rendering on both native architectures.</text><rect x="45" y="130" width="545" height="195" rx="12" fill="#16212C" stroke="#22D3EE"/><text x="67" y="166" fill="#22D3EE" font-size="22" font-weight="600">ARM64 EDGE DEVICE</text><text x="67" y="198" fill="#93A3B2" font-size="17" font-weight="400">8 cores · 4 Cortex-A55 + 4 Cortex-A78</text><text x="67" y="224" fill="#93A3B2" font-size="17" font-weight="400">11.29 GiB RAM visible to the OS</text><text x="67" y="250" fill="#93A3B2" font-size="17" font-weight="400">Ubuntu 24.04.5 · native ARM64 containers</text><rect x="615" y="130" width="540" height="195" rx="12" fill="#16212C" stroke="#2A3540"/><text x="637" y="166" fill="#F8FAFC" font-size="22" font-weight="600">x86_64 MINI PC</text><text x="637" y="198" fill="#93A3B2" font-size="17" font-weight="400">AMD Ryzen 7 5800U · 8 cores / 16 threads</text><text x="637" y="224" fill="#93A3B2" font-size="17" font-weight="400">30.76 GiB RAM visible to the OS</text><text x="637" y="250" fill="#93A3B2" font-size="17" font-weight="400">Debian 13 · native AMD64 containers</text><text x="45" y="368" fill="#93A3B2" font-size="19" font-weight="400">Tested hardware and observed costs; these are not universal minimum requirements.</text></g></svg>
